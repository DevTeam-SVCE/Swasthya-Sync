version: '3.8'

services:
  app:
    build: .
    ports:
      - "5001:5001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=dscribe_hms
      - DB_USER=postgres
      - DB_PASSWORD=svce@2001
      - JWT_SECRET=18d1be13902d55f06ededf75d65a722feb8c57b41bf7b39b89237dfb5cde9ef7
      - NODE_ENV=production
      - PORT=5001
    depends_on:
      - postgres
    volumes:
      # Use a named volume for uploads so PDFs persist across container restarts
      - uploads_data:/app/server/uploads
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=svce@2001
      - POSTGRES_DB=dscribe_hms
    ports:
      # Changed host port to 5433 to prevent "address already in use" errors if a local postgres is already running
      - "5433:5432"
    volumes:
      # Data persistence for postgres
      - pgdata:/var/lib/postgresql/data
      # Mount the schema / seed data we created earlier to auto-initialize!
      - ./server/dscribe_hms_import.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
